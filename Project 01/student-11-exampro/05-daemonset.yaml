apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: student-11-exampro-node-agent
  namespace: exam-dev
  labels:
    app: exampro-node-agent
    environment: development
spec:
  selector:
    matchLabels:
      app: exampro-node-agent
      environment: development
  template:
    metadata:
      labels:
        app: exampro-node-agent
        environment: development
    spec:
      containers:
        - name: node-agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date -Iseconds) heartbeat from node ${NODE_NAME}"
                sleep 30
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
