apiVersion: v1
kind: Secret
metadata:
  name: student-11-exampro-db-credentials
  namespace: exam-dev
type: Opaque
stringData:
  POSTGRES_DB: exampro
  POSTGRES_USER: exampro_admin
  POSTGRES_PASSWORD: exampro-dev-password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: student-11-exampro-db
  namespace: exam-dev
  labels:
    app: exampro-db
    environment: development
spec:
  serviceName: student-11-exampro-db-headless
  replicas: 2
  selector:
    matchLabels:
      app: exampro-db
      environment: development
  template:
    metadata:
      labels:
        app: exampro-db
        environment: development
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: student-11-exampro-db-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: student-11-exampro-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-11-exampro-db-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: exampro-db
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
