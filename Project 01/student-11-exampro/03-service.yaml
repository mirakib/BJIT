apiVersion: v1
kind: Service
metadata:
  name: student-11-exampro-service
  namespace: exam-dev
  labels:
    app: exampro
    environment: development
spec:
  type: NodePort
  selector:
    app: exampro
    environment: development
  ports:
    - name: http
      port: 80
      targetPort: 8011
      nodePort: 30091
---
apiVersion: v1
kind: Service
metadata:
  name: student-11-exampro-db-headless
  namespace: exam-dev
  labels:
    app: exampro-db
    environment: development
spec:
  clusterIP: None
  selector:
    app: exampro-db
    environment: development
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
