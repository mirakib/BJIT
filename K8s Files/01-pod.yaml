apiVersion: v1
kind: Pod 
metadata:
  name: hello-pod
  labels:
    app: hello-pod
spec:                    
  containers:
  - name: web
    image: nginx:1.27
    ports:
    - containerPort: 80
    command: ["sh", "-c", "echo '<h1>hello-pod</h1>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
---
apiVersion: v1
kind: Service
metadata:
  name: hello-pod
spec:
  type: NodePort
  selector:
    app: hello-pod
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30082
